<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- Para instalarla como app desde el navegador -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0d10" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CuerPro" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0c0d10;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
      // Guardamos el aviso de "instalar" para mostrarlo con nuestro botón
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__cuerproInstalar = e;
        window.dispatchEvent(new Event('cuerpro-instalable'));
      });
    </script>
  </head>

  <body>
    <noscript>Necesitás activar JavaScript para usar CuerPro.</noscript>
    <div id="root"></div>
  </body>
</html>
